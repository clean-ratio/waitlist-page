<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The collection — Clean Ratio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/typography.css" />
    <style>
      :root { color-scheme: light }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center;
        padding: 24px; text-align: center;
        background: #f2efea; color: #1a1916;
        font: var(--font-body-weight) 15px/1.7 var(--font-body);
        font-synthesis: none;
      }
      h1 { font: var(--font-display-weight) 44px/1.3 var(--font-display); letter-spacing: 0; margin: 0 0 10px }
      h1 em { font-style: italic }
      p { margin: 0 0 20px; color: #6e6a63; font-size: 13px }
      a { color: inherit }
    </style>
  </head>
  <body>
    <main>
      <h1>A moment <em>to pause.</em></h1>
      <p>Quiet places, familiar sounds, and a little room to be.</p>
      <p><a href="/">Back</a></p>
    </main>
  </body>
</html>
