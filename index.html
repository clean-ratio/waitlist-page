<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf0e8" />

    <title>Clean Ratio — Return to your natural rhythm</title>
    <meta
      name="description"
      content="%HERO_DESCRIPTION%"
    />

    <!-- Share metadata is independent of the client-rendered waitlist. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clean Ratio — Return to your natural rhythm" />
    <meta
      property="og:description"
      content="%HERO_DESCRIPTION%"
    />
    <meta property="og:image" content="/og.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/logo_files/favicon.png" type="image/png" sizes="64x64" />
    <link rel="preload" as="image" href="/images/hero/glacier-wide.webp" media="(min-aspect-ratio: 1/1)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hero/glacier-tall.webp" media="(max-aspect-ratio: 1/1)" fetchpriority="high" />

    <link rel="stylesheet" href="/typography.css" />
    <link rel="preload" href="/fonts/Ranade-Thin.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/Ranade-Light.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/FragmentMono-Regular.ttf" as="font" type="font/ttf" crossorigin />

    <style>
      /* Inlined so the cover paints before anything else loads. */
      :root {
        --bone: #edf0e8;
        --ink: #1a271f;
        --stone: #4d5d51;
        --hairline: rgb(26 39 31 / 0.18);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #9fc3d1 url('/images/hero/glacier-wide.webp') center 45% / cover no-repeat;
        color: var(--ink);
        font: var(--font-body-weight) 16px/1.618 var(--font-body);
        font-synthesis: none;
      }
      #root {
        height: 100%;
      }
      @media (max-aspect-ratio: 1/1) {
        html,
        body {
          background-image: url('/images/hero/glacier-tall.webp');
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
